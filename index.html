
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L7AJ WEBSITE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10051f;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }
    .card {
      max-width: 400px;
      margin: 45px auto;
      padding: 25px;
      background: #201033;
      border: 1px solid #7946ad;
      border-radius: 18px;
      box-sizing: border-box;
    }
    h1 { color: #c084fc; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #70439a;
      background: #10051f;
      color: white;
    }
    button {
      border: none;
      background: #9333ea;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status { overflow-wrap: anywhere; line-height: 1.7; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>L7AJ WEBSITE</h1>
    <p>مرحبا بيك في موقع الحاج</p>

    <div id="authArea">
      <input id="email" type="email"
        placeholder="البريد الإلكتروني" autocomplete="email">
      <input id="password" type="password"
        placeholder="كلمة السر" autocomplete="current-password">

      <button id="signupBtn">إنشاء حساب</button>
      <button id="loginBtn">تسجيل الدخول</button>
    </div>

    <div id="userArea" class="hidden">
      <h2>مرحبا بيك ❤️</h2>
      <p>تم تسجيل الدخول بنجاح!</p>
      <p id="userEmail"></p>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>

    <p id="status" role="status"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://eqnbmmbjkdykzoldjxjp.supabase.co";

    // حطّ هنا نفس Publishable Key الموجود في كودك القديم.
    const SUPABASE_KEY = "sb_publishable_LKEgNqgJKg4KwqNV6Ml4Mg_OxP0bd3W";

    const client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const authArea = document.getElementById("authArea");
    const userArea = document.getElementById("userArea");
    const status = document.getElementById("status");

    function showUser(user) {
      authArea.classList.add("hidden");
      userArea.classList.remove("hidden");
      document.getElementById("userEmail").textContent = user.email || "";
    }

    function showLogin() {
      authArea.classList.remove("hidden");
      userArea.classList.add("hidden");
    }

    async function refreshSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        status.textContent = error.message;
        return;
      }

      if (data.session) {
        showUser(data.session.user);
      } else {
        showLogin();
      }
    }

    document.getElementById("signupBtn").onclick = async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        status.textContent = "اكتب الإيميل وكلمة السر.";
        return;
      }

      status.textContent = "جاري إنشاء الحساب...";

      const { data, error } = await client.auth.signUp({
        email,
        password
      });

      if (error) {
        status.textContent = error.message;
        return;
      }

      if (data.session) {
        showUser(data.session.user);
        status.textContent = "تم إنشاء الحساب والدخول بنجاح!";
      } else {
        status.textContent =
          "تم إنشاء الحساب. يلزم تسجيل الدخول إذا ما عندكش جلسة دخول.";
      }
    };

    document.getElementById("loginBtn").onclick = async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        status.textContent = "اكتب الإيميل وكلمة السر.";
        return;
      }

      status.textContent = "جاري تسجيل الدخول...";

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        status.textContent = error.message;
        return;
      }

      showUser(data.user);
      status.textContent = "تم تسجيل الدخول بنجاح!";
    };

    document.getElementById("logoutBtn").onclick = async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        status.textContent = error.message;
        return;
      }

      showLogin();
      passwordInput.value = "";
      status.textContent = "خرجت من حسابك بنجاح.";
    };

    client.auth.onAuthStateChange((_event, session) => {
      if (session) {
        showUser(session.user);
      } else {
        showLogin();
      }
    });

    refreshSession();
  </script>
</body>
</html>
