
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L7AJ Website</title>
<style>
body {
  background: #100d1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.box {
  max-width: 380px;
  margin: 40px auto;
  background: #211a32;
  padding: 22px;
  border-radius: 16px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 8px;
  border: 0;
}
button {
  background: #8b5cf6;
  color: white;
  font-weight: bold;
}
h1 { color: #c4a5ff; }
</style>
</head>
<body>
<div class="box">
  <h1>L7AJ WEBSITE</h1>
  <h3>إنشاء حساب أو تسجيل الدخول</h3>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة السر (8 أحرف على الأقل)">
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل الدخول</button>
  <button onclick="logout()">تسجيل الخروج</button>
  <p id="msg">مرحبا بيك في L7AJ Website</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://eqnbmmbjkdykzoldjxjp.supabase.co";
const SUPABASE_KEY = "sb_publishable_LKEgNqgJKg4KwqNV6Ml4Mg_OxP0bd3W";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const msg = document.getElementById("msg");

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || password.length < 8) {
    msg.textContent = "اكتب إيميل صحيح وكلمة سر من 8 أحرف على الأقل.";
    return;
  }
  const { error } = await client.auth.signUp({ email, password });
  msg.textContent = error ? error.message :
    "تم إرسال طلب التسجيل. تفقد بريدك الإلكتروني إذا طُلب التأكيد.";
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await client.auth.signInWithPassword({ email, password });
  msg.textContent = error ? error.message : "تم تسجيل الدخول بنجاح!";
}

async function logout() {
  const { error } = await client.auth.signOut();
  msg.textContent = error ? error.message : "تم تسجيل الخروج.";
}
</script>
</body>
</html>
